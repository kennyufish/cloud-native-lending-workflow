global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: application-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [application-service:8080]

  - job_name: decision-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [decision-worker:8081]
